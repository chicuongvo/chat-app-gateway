services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-gateway
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
      - "9468:9464"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEWAY_PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:4003}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:4001}
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-http://chat-service:4002}
      MULTIMEDIA_SERVICE_URL: ${MULTIMEDIA_SERVICE_URL:-http://multimedia-service:4004}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:4010}
      REALTIME_SERVICE_URL: ${REALTIME_SERVICE_URL:-http://realtime-service:3001}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_METRICS_PORT: 9464
    networks:
      - chatapp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  chatapp-network:
    external: true
